<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>TaskFlow</h1>

    <section id="auth-view">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password (min 6)" />
      <div class="row">
        <button id="login-btn">Login</button>
        <button id="register-btn" class="secondary">Register</button>
      </div>
      <p id="auth-msg" class="msg"></p>
    </section>

    <section id="task-view" hidden>
      <div class="row between">
        <span id="user-email"></span>
        <button id="logout-btn" class="secondary">Logout</button>
      </div>
      <div class="row">
        <input id="task-title" placeholder="New task..." />
        <button id="add-btn">Add</button>
      </div>
      <ul id="task-list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
